<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>
            {% block title %}CyberNews Tracker{% endblock %}
        </title>
        <link rel="stylesheet" href="/static/style.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
    </head>
    <body>
        <header>
            <span class="logo">CyberNews Tracker</span>
            <nav>
                <div class="search-wrapper">
                    <input type="text" id="nav-search"
                    data-i18n-placeholder="nav.search.placeholder"
                    placeholder="Suche..." />
                    <button id="search-clear" style="display:none">×</button>
                </div>
                <select id="nav-filter">
                    <option value="all"         data-i18n="nav.filter.all">Alle Themen</option>
                    <option value="security"    data-i18n="nav.filter.security">Security</option>
                    <option value="geopolitics" data-i18n="nav.filter.geopolitics">Geopolitik</option>
                    <option value="science"     data-i18n="nav.filter.science">Wissenschaft</option>
                    <option value="networks"    data-i18n="nav.filter.networks">Netzwerke</option>
                    <option value="local"       data-i18n="nav.filter.local">DE/EU</option>
                </select>
                <button id="lang-toggle" title="Sprache wechseln">🇩🇪</button>
                <button id="settings-btn" title="Einstellungen">⚙️</button>
                <a href="/admin" id="admin-link" data-i18n="nav.admin" style="display:none">Admin</a>
                <button id="login-btn" data-i18n="nav.login">Login</button>
                <a href="#" id="logout-link" data-i18n="nav.logout" style="display:none">Logout</a>
            </nav>
        </header>

        {% block content %}
        {% endblock %}
        <footer></footer>
        <script>
            document.querySelector("footer").textContent = `© ${new Date().getFullYear()} CyberNews Tracker`;
        </script>
        <!-- Settings Panel -->
        <div id="settings-panel" style="display:none">
            <div id="settings-backdrop"></div>
            <div id="settings-content">
                <div id="settings-header">
                    <span>Einstellungen</span>
                    <button id="settings-close">×</button>
                </div>

                <div class="settings-section">
                    <h3>Module</h3>
                    <div id="module-checklist">
                        <label class="settings-check">
                            <input type="checkbox" data-module="map" checked />
                            Karte
                        </label>
                        <label class="settings-check">
                            <input type="checkbox" data-module="stream" checked />
                            Livestream
                        </label>
                        <label class="settings-check">
                            <input type="checkbox" data-module="weather-stocks" checked />
                            Wetter &amp; Kurse
                        </label>
                        <label class="settings-check">
                            <input type="checkbox" data-module="headlines" checked />
                            Headlines
                        </label>
                        <label class="settings-check">
                            <input type="checkbox" data-module="article" checked />
                            Artikel-Viewer
                        </label>
                    </div>
                </div>

                <div class="settings-section">
                    <button id="grid-reset-btn">Grid zurücksetzen</button>
                </div>
            </div>
        </div>

        <!-- Login Modal -->
        <div id="login-modal" class="modal" style="display:none">
            <div class="modal__backdrop" id="login-backdrop"></div>
            <div class="modal__content modal__content--login">
                <button class="modal__close" id="login-modal-close">×</button>

                <div class="auth-tabs">
                    <button class="auth-tab auth-tab--active" id="tab-login-btn">Anmelden</button>
                    <button class="auth-tab" id="tab-register-btn">Registrieren</button>
                </div>

                <div id="login-form-wrapper">
                    <p class="login-modal__subtitle" data-i18n="login.subtitle">
                        Für persönliche Features wie Watchlist und Admin-Zugriff.
                    </p>
                    <form id="login-form">
                        <div class="login-field">
                            <label for="username" data-i18n="login.username">Benutzername</label>
                            <input type="text" id="username" required autocomplete="username" />
                        </div>
                        <div class="login-field">
                            <label for="password" data-i18n="login.password">Passwort</label>
                            <input type="password" id="password" required autocomplete="current-password" />
                        </div>
                        <p id="login-error" class="login-error"></p>
                        <button type="submit" class="login-submit" data-i18n="login.submit">Einloggen</button>
                    </form>
                </div>

                <div id="register-form-wrapper" style="display:none">
                    <p class="login-modal__subtitle">
                        Neuer Account — erhält automatisch Analyst-Zugriff.
                    </p>
                    <form id="register-form">
                        <div class="login-field">
                            <label>Benutzername</label>
                            <input type="text" id="reg-username" required />
                        </div>
                        <div class="login-field">
                            <label>Passwort (min. 8 Zeichen)</label>
                            <input type="password" id="reg-password" required />
                        </div>
                        <div class="login-field">
                            <label>Passwort wiederholen</label>
                            <input type="password" id="reg-password2" required />
                        </div>
                        <div class="login-field">
                            <label>E-Mail (optional)</label>
                            <input type="email" id="reg-email" autocomplete="email" />
                        </div>
                        <div class="login-field" style="flex-direction:row; align-items:center; gap:8px">
                            <input type="checkbox" id="reg-agb" required />
                            <label for="reg-agb" style="text-transform:none; letter-spacing:0; font-size:12px">
                                Ich akzeptiere die
                                <a href="/agb" target="_blank" style="color:var(--accent)">Nutzungsbedingungen</a>
                            </label>
                        </div>
                        <p id="register-error" class="login-error"></p>
                        <p id="register-success" style="color:var(--accent-green);font-size:13px;min-height:18px"></p>
                        <button type="submit" class="login-submit">Registrieren</button>
                    </form>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/interactjs@1.10.27/dist/interact.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
        <script src="/static/translations.js"></script>
        <script src="/static/lang.js"></script>
        <script src="/static/login.js"></script>
        {% block scripts %}
        {% endblock %}
    </body>
</html>
