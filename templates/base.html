<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>
            {% block title %}CyberNews Tracker{% endblock %}
        </title>
        <link rel="stylesheet" href="/static/style.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
    </head>
    <body>
        <header>
            <span class="logo">CyberNews Tracker</span>
            <nav>
                <div class="search-wrapper">
                    <input type="text" id="nav-search" placeholder="Suche..." />
                    <button id="search-clear" style="display:none">×</button>
                </div>
                <select id="nav-filter">
                    <option value="all">Alle Themen</option>
                    <option value="security">Security</option>
                    <option value="geopolitics">Geopolitik</option>
                    <option value="science">Wissenschaft</option>
                    <option value="networks">Netzwerke</option>
                    <option value="local">DE/EU</option>
                </select>
                <select id="lang-toggle">
                    <option value="de">🇩🇪 DE / €</option>
                    <option value="us">🇺🇸 US / $</option>
                </select>
                <a href="/admin" id="admin-link" style="display:none">Admin</a>
                <a href="/login" id="login-link" style="display:none">Login</a>
                <a href="#" id="logout-link" style="display:none">Logout</a>
            </nav>
        </header>

        {% block content %}
        {% endblock %}
        <footer></footer>
        <script>
            document.querySelector("footer").textContent = `© ${new Date().getFullYear()} CyberNews Tracker`;
        </script>
        <script>
            const langToggle = document.getElementById("lang-toggle");
            if (langToggle) {
                langToggle.value = localStorage.getItem("lang") || "de";
                langToggle.addEventListener("change", () => {
                    localStorage.setItem("lang", langToggle.value);
                });
            }
        </script>
        <script>
            (async () => {
                const token = localStorage.getItem("token");
                const loginLink  = document.getElementById("login-link");
                const logoutLink = document.getElementById("logout-link");
                const adminLink  = document.getElementById("admin-link");

                if (!token) {
                    if (loginLink) loginLink.style.display = "inline";
                    return;
                }

                const res = await fetch("/api/me", {
                    headers: { Authorization: "Bearer " + token }
                });

                if (!res.ok) {
                    localStorage.removeItem("token");
                    if (loginLink) loginLink.style.display = "inline";
                    return;
                }

                const me = await res.json();
                if (logoutLink) logoutLink.style.display = "inline";
                if (adminLink && me.role === "admin") adminLink.style.display = "inline";

                if (logoutLink) {
                    logoutLink.addEventListener("click", async (e) => {
                        e.preventDefault();
                        await fetch("/api/logout", { method: "POST" });
                        localStorage.removeItem("token");
                        window.location.href = "/login";
                    });
                }
            })();
        </script>
        <script src="https://cdn.jsdelivr.net/npm/interactjs@1.10.27/dist/interact.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
        {% block scripts %}
        {% endblock %}
    </body>
</html>
