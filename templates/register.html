<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Registrieren — CyberNews Tracker</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0d1117;
            color: #e6edf3;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 40px;
            width: min(420px, 90vw);
        }
        .card h1 {
            font-size: 22px;
            margin-bottom: 8px;
            color: #58a6ff;
        }
        .card > p {
            font-size: 13px;
            color: #8b949e;
            margin-bottom: 28px;
            line-height: 1.6;
        }
        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }
        .field--row {
            flex-direction: row;
            align-items: center;
            gap: 8px;
        }
        label {
            font-size: 12px;
            font-weight: 600;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .field--row label {
            text-transform: none;
            letter-spacing: 0;
            font-size: 12px;
            font-weight: 400;
        }
        input[type=text],
        input[type=email],
        input[type=password] {
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #e6edf3;
            padding: 10px 12px;
            font-size: 14px;
            width: 100%;
        }
        input:focus { outline: none; border-color: #58a6ff; }
        input[type=checkbox] {
            width: 16px;
            height: 16px;
            accent-color: #58a6ff;
            flex-shrink: 0;
        }
        .agb-link { color: #58a6ff; text-decoration: none; }
        button[type=submit] {
            width: 100%;
            background: #58a6ff;
            border: none;
            border-radius: 6px;
            color: #000;
            font-size: 14px;
            font-weight: 700;
            padding: 12px;
            cursor: pointer;
            margin-top: 8px;
        }
        button[type=submit]:hover { opacity: 0.85; }
        #error {
            color: #f85149;
            font-size: 13px;
            min-height: 20px;
            margin-bottom: 8px;
        }
        .login-hint {
            text-align: center;
            font-size: 12px;
            color: #8b949e;
            margin-top: 16px;
        }
        .login-hint a { color: #58a6ff; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Registrieren</h1>
        <p>Neuer Account — erhält automatisch Analyst-Zugriff.</p>

        <div class="field">
            <label>Benutzername</label>
            <input type="text" id="username" autocomplete="username" />
        </div>
        <div class="field">
            <label>E-Mail (optional)</label>
            <input type="email" id="email" autocomplete="email" />
        </div>
        <div class="field">
            <label>Passwort (min. 8 Zeichen)</label>
            <input type="password" id="password" autocomplete="new-password" />
        </div>
        <div class="field">
            <label>Passwort wiederholen</label>
            <input type="password" id="password2" autocomplete="new-password" />
        </div>
        <div class="field field--row">
            <input type="checkbox" id="agb" />
            <label for="agb">
                Ich akzeptiere die
                <a href="/agb" target="_blank" class="agb-link">Nutzungsbedingungen</a>
            </label>
        </div>

        <p id="error"></p>
        <button type="submit" id="submit-btn">Account erstellen</button>

        <p class="login-hint">
            Bereits registriert?
            <a href="/?login=1">Einloggen →</a>
        </p>
    </div>

    <script>
        document.getElementById("submit-btn").addEventListener("click", async () => {
            const username  = document.getElementById("username").value.trim();
            const email     = document.getElementById("email").value.trim();
            const password  = document.getElementById("password").value;
            const password2 = document.getElementById("password2").value;
            const agb       = document.getElementById("agb").checked;
            const errorEl   = document.getElementById("error");

            errorEl.textContent = "";

            if (!username || !password) {
                errorEl.textContent = "Bitte Username und Passwort ausfüllen.";
                return;
            }
            if (password !== password2) {
                errorEl.textContent = "Passwörter stimmen nicht überein.";
                return;
            }
            if (password.length < 8) {
                errorEl.textContent = "Passwort muss mindestens 8 Zeichen haben.";
                return;
            }
            if (!agb) {
                errorEl.textContent = "Bitte Nutzungsbedingungen akzeptieren.";
                return;
            }

            const res = await fetch("/api/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, email: email || null, password, agb_accepted: true })
            });

            const data = await res.json();

            if (res.ok) {
                window.location.href = "/?login=1";
            } else {
                errorEl.textContent = data.error || "Fehler bei der Registrierung.";
            }
        });
    </script>
</body>
</html>
