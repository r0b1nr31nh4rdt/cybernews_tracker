<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>CyberNews Setup</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0d1117;
            color: #e6edf3;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .setup-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 40px;
            width: min(420px, 90vw);
        }
        .setup-card h1 {
            font-size: 22px;
            margin-bottom: 8px;
            color: #58a6ff;
        }
        .setup-card p {
            font-size: 13px;
            color: #8b949e;
            margin-bottom: 28px;
            line-height: 1.6;
        }
        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }
        label {
            font-size: 12px;
            font-weight: 600;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input {
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #e6edf3;
            padding: 10px 12px;
            font-size: 14px;
        }
        input:focus { outline: none; border-color: #58a6ff; }
        button {
            width: 100%;
            background: #58a6ff;
            border: none;
            border-radius: 6px;
            color: #000;
            font-size: 14px;
            font-weight: 700;
            padding: 12px;
            cursor: pointer;
            margin-top: 8px;
        }
        button:hover { opacity: 0.85; }
        #error {
            color: #f85149;
            font-size: 13px;
            min-height: 20px;
            margin-bottom: 8px;
        }
        #success {
            display: none;
            background: #1a3a2a;
            border: 1px solid #3fb950;
            border-radius: 6px;
            padding: 16px;
            color: #3fb950;
            font-size: 14px;
            line-height: 1.6;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="setup-card">
        <h1>CyberNews Setup</h1>
        <p>Erstmalige Einrichtung. Lege einen Administrator-Account an.
           Dieser Endpoint wird danach dauerhaft gesperrt.</p>

        <div class="field">
            <label>Benutzername</label>
            <input type="text" id="username" autocomplete="username" />
        </div>
        <div class="field">
            <label>Passwort (min. 8 Zeichen)</label>
            <input type="password" id="password" autocomplete="new-password" />
        </div>
        <div class="field">
            <label>Passwort wiederholen</label>
            <input type="password" id="password2" autocomplete="new-password" />
        </div>

        <p id="error"></p>
        <button id="submit-btn">Admin anlegen</button>

        <div id="success"></div>
    </div>

    <script>
        document.getElementById("submit-btn").addEventListener("click", async () => {
            const username  = document.getElementById("username").value.trim();
            const password  = document.getElementById("password").value;
            const password2 = document.getElementById("password2").value;
            const errorEl   = document.getElementById("error");
            const successEl = document.getElementById("success");

            errorEl.textContent = "";

            if (!username || !password) {
                errorEl.textContent = "Bitte alle Felder ausfüllen.";
                return;
            }
            if (password !== password2) {
                errorEl.textContent = "Passwörter stimmen nicht überein.";
                return;
            }
            if (password.length < 8) {
                errorEl.textContent = "Passwort muss mindestens 8 Zeichen haben.";
                return;
            }

            const res = await fetch("/setup", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password })
            });

            const data = await res.json();

            if (res.ok) {
                document.getElementById("submit-btn").style.display = "none";
                successEl.innerHTML = `
                    ✅ ${data.message}<br><br>
                    <a href="/" style="color:#58a6ff">→ Zum Dashboard</a>
                `;
                successEl.style.display = "block";
            } else {
                errorEl.textContent = data.error || "Fehler beim Anlegen.";
            }
        });
    </script>
</body>
</html>
