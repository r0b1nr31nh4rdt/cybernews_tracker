<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 300px;
      padding: 16px;
      font-family: system-ui, sans-serif;
      font-size: 14px;
    }
    #status { margin: 8px 0; min-height: 20px; }
    .success { color: green; }
    .error   { color: red; }
    input {
      width: 100%;
      padding: 6px;
      margin: 4px 0 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      width: 100%;
      padding: 8px;
      background: #2a6496;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background: #1e4d73; }
    #save-btn { background: #27ae60; }
    #save-btn:hover { background: #1e8449; }
    #logout-btn {
      background: transparent;
      color: #999;
      font-size: 12px;
      margin-top: 8px;
    }
    #login-section, #main-section { display: none; }
  </style>
</head>
<body>

  <!-- Login -->
  <div id="login-section">
    <h3 style="margin:0 0 12px">CyberNews Login</h3>
    <input type="text"     id="username" placeholder="Benutzername" />
    <input type="password" id="password" placeholder="Passwort" />
    <button id="login-btn">Einloggen</button>
    <div id="status"></div>
  </div>

  <!-- Eingeloggt -->
  <div id="main-section">
    <button id="save-btn">📥 In Inbox speichern</button>
    <div id="status"></div>
    <button id="logout-btn">Ausloggen</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
